<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f8fafc" />
<link rel="icon" href="data:," />
<title>Crucible — expression language</title>
<style>
  :root{--ink:#14181d;--muted:#5b6670;--line:#e2e6ea;--bg:#f6f7f9;--card:#fff;--accent:#2f5bea;--ok:#177245;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:16px;letter-spacing:-.01em}
  h1 span{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
  main{max-width:880px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  textarea,input[type="text"]{width:100%;padding:10px 12px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:8px;background:#fff;color:inherit}
  textarea{min-height:70px;resize:vertical}
  button{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  button.secondary{background:#fff;color:var(--ink);border-color:var(--line)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .out{font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:0}
  .ok{color:var(--ok);font-weight:700}
  .bad{color:var(--bad);font-weight:700}
  .muted{color:var(--muted)}
  .tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:24px}
  .tok{font:12.5px/1.4 ui-monospace,monospace;background:#eef1f4;border-radius:6px;padding:3px 8px}
  .tok b{color:var(--accent)}
  .hint{color:var(--muted);font-size:12.5px;margin:10px 0 0}

  /* --- small screens: phone and tablet --- */
  @media (max-width: 720px) {
    body { font-size: 14.5px; }
    header { padding: 12px 14px; }
    main { padding: 14px 12px 34px; gap: 13px; }
    .card { padding: 13px; border-radius: 10px; }
    .row { flex-direction: column; align-items: stretch; gap: 10px; }
    .row > div { min-width: 0; flex: 1 1 auto; }
    .row > button { width: 100%; }
    input, select, textarea { width: 100%; min-width: 0; font-size: 16px; }
    button { padding: 10px 12px; }
    table { display: block; overflow-x: auto; max-width: 100%; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    pre, code, .out, .code, .mono { max-width: 100%; overflow-x: auto; }
    img, svg, canvas { max-width: 100%; height: auto; }
    h1 { font-size: 15.5px; }
  }
  @media (max-width: 420px) {
    main { padding: 10px 9px 26px; }
    .stats { gap: 6px; }
    .stat, .pill { font-size: 11.5px; }
    table { font-size: 12px; }
  }

  /* --- modern theme: shared across all ten demos --- */
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e6e9f0; --bg:#f8fafc; --card:#ffffff;
    --accent:#4f46e5; --accent-soft:rgba(79,70,229,.12); --ok:#0f766e; --bad:#b91c1c;
    --radius:16px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 32px -18px rgba(15,23,42,.28);
  }
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    color:var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -12%, rgba(79,70,229,.10), transparent 62%),
      radial-gradient(700px 380px at 100% 0%, rgba(14,165,233,.07), transparent 60%),
      var(--bg);
    font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    font-feature-settings:"cv02","cv03","cv04","cv11";
  }
  header{
    position:sticky; top:0; z-index:20;
    padding:16px 24px; border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
  }
  h1{font-size:17px;font-weight:650;letter-spacing:-.02em;line-height:1.35}
  h1 span{margin-top:3px;font-size:12.5px;font-weight:450;color:var(--muted);letter-spacing:0}
  main{width:100%;max-width:920px;margin:0 auto;padding:28px 22px 64px;gap:18px}
  .card{
    padding:22px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--card); box-shadow:var(--shadow);
  }
  label{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--muted)}
  input,select,textarea{
    padding:10px 12px; font-size:14px; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:10px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
  }
  button{
    padding:10px 16px; font-size:14px; font-weight:600; color:#fff; cursor:pointer;
    border:0; border-radius:10px;
    background:linear-gradient(180deg,#6159f2,#4f46e5);
    box-shadow:0 1px 2px rgba(15,23,42,.14), 0 10px 22px -14px rgba(79,70,229,.95);
    transition:filter .15s ease, transform .12s ease;
  }
  button:hover{filter:brightness(1.06)}
  button:active{transform:translateY(1px)}
  button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  button.secondary:hover{background:#f1f5f9;filter:none}
  .pill{
    padding:6px 12px; border-radius:999px; white-space:nowrap;
    font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ok); background:rgba(15,118,110,.08); border:1px solid rgba(15,118,110,.22);
  }
  .out{
    margin:0; padding:16px 18px; max-height:440px; overflow:auto; white-space:pre-wrap; word-break:break-word;
    font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#e2e8f0; background:#0f172a; border:1px solid #1e293b; border-radius:12px;
  }
  code{
    padding:1px 6px; border-radius:6px; font-size:.92em;
    color:var(--accent); background:var(--accent-soft);
  }
  .out code,.out a{color:#a5b4fc;background:none}
  .hint{margin:14px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{
    padding:10px 12px; text-align:left; font-size:11px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    border-bottom:1px solid var(--line);
  }
  td{padding:10px 12px;font-size:13.5px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  a{color:var(--accent);text-underline-offset:3px}
  .row{margin-top:12px}
  .tok,.chip{
    padding:4px 10px; border-radius:999px; font-size:12px; font-weight:650;
    border:1px solid var(--line); background:#f1f5f9; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .chip.ok{color:var(--ok);background:rgba(15,118,110,.08);border-color:rgba(15,118,110,.2)}
  .chip.no{color:var(--bad);background:rgba(185,28,28,.08);border-color:rgba(185,28,28,.2)}
  .tok b{color:var(--accent)}
  @media (max-width:720px){
    header{padding:14px 16px}
    main{padding:20px 14px 44px;gap:14px}
    .card{padding:16px;border-radius:14px}
    .row{flex-direction:column;align-items:stretch;gap:10px}
    .row>button,.row>input,.row>select{width:100%!important}
    input,select,textarea{width:100%!important;font-size:16px}
    table{display:block;overflow-x:auto;white-space:nowrap}
  }
</style>
</head>
<body>
<header>
  <h1>Crucible<span>a hand-written lexer, parser and evaluator — no eval()</span></h1>
</header>
<main>
  <section class="card">
    <label for="source">Expression</label>
    <textarea id="source">2 + 3 * 4</textarea>
    <div class="row">
      <button id="run" type="button">Evaluate</button>
      <button id="sample" class="secondary" type="button">Try another</button>
    </div>
    <p class="hint">Operators: <b>+ - * / % **</b>, comparisons, <b>&amp;&amp; || !</b>. Builtins: min, max, abs, round, floor, ceil, len, upper, lower.</p>
    <label for="env" style="margin-top:14px">Context (JSON)</label>
    <textarea id="env">{ "total": 150, "vip": true }</textarea>
  </section>
  <section class="card">
    <label>Result</label>
    <div id="result" class="out muted">Press Evaluate.</div>
    <label style="margin-top:16px">Tokens</label>
    <div id="tokens" class="tokens"></div>
  </section>
</main>
<script>
  const $ = (selector) => document.querySelector(selector);
  const samples = ["2 + 3 * 4", "(2 + 3) * 4", "round(2.567, 2)", "max(3, 9, 2) - 1", "total > 100 && vip", "len(upper('buffy'))", "1 + * 2"];
  let sampleIndex = 0;

  async function post(path, body) {
    const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    return { status: res.status, data: await res.json().catch(() => ({})) };
  }

  function line(text, className) {
    const node = document.createElement("div");
    node.className = className;
    node.textContent = text;
    return node;
  }

  async function evaluate() {
    const source = $("#source").value;
    let env = {};
    try {
      env = JSON.parse($("#env").value || "{}");
    } catch {
      $("#result").textContent = "Context is not valid JSON.";
      return;
    }

    const [evaluation, tokens] = await Promise.all([
      post("/evaluate", { source, env }),
      post("/tokens", { source }),
    ]);

    const result = $("#result");
    result.replaceChildren();
    result.className = "out";

    if (evaluation.data.ok) {
      result.append(line("= " + JSON.stringify(evaluation.data.value), "ok"));
    } else {
      const error = evaluation.data.error ?? {};
      if (typeof error.position === "number") {
        result.append(line(source, "muted"));
        result.append(line(" ".repeat(error.position) + "^", "muted"));
        result.append(line((error.message ?? "evaluation failed") + " (position " + error.position + ")", "bad"));
      } else {
        result.append(line(error.message ?? "evaluation failed", "bad"));
      }
    }

    const box = $("#tokens");
    box.replaceChildren();
    const list = tokens.data.tokens ?? [];
    if (!list.length) {
      box.append(line(tokens.data.error?.message ?? "no tokens", "muted"));
      return;
    }
    for (const token of list) {
      const chip = document.createElement("span");
      chip.className = "tok";
      const type = document.createElement("b");
      type.textContent = token.type;
      chip.append(type, ": " + token.value);
      box.append(chip);
    }
  }

  $("#run").addEventListener("click", evaluate);
  $("#sample").addEventListener("click", () => {
    sampleIndex = (sampleIndex + 1) % samples.length;
    $("#source").value = samples[sampleIndex];
    evaluate();
  });
  evaluate();
</script>
</body>
</html>
